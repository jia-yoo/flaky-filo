<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 변동 이력 - Flaky Filo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar-placeholder"></div>
<script src="js/common.js"></script>

<main class="page">
    <div class="page-header">
        <a href="materials.html" class="back-link">← 원재료 목록으로</a>
        <h1 id="material-name">재고 변동 이력</h1>
        <p id="material-summary"></p>
    </div>

    <section class="card" style="margin-bottom: 24px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <label style="margin:0; display:flex; align-items:center; gap:6px; font-size:13px;">
                시작일
                <input type="date" id="from-date">
            </label>
            <label style="margin:0; display:flex; align-items:center; gap:6px; font-size:13px;">
                종료일
                <input type="date" id="to-date">
            </label>
            <span style="font-size:12px; color:var(--text-secondary);">기본값은 이번 달 1일 ~ 오늘이에요. 기간을 바꾸면 바로 다시 조회돼요.</span>
        </div>
    </section>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>일시</th>
                <th>구분</th>
                <th>변동량</th>
                <th>사유</th>
            </tr>
            </thead>
            <tbody id="history-table-body">
            <!-- JS가 채워넣음 -->
            </tbody>
        </table>

        <div id="empty-state" class="empty-state" style="display:none;">
            아직 재고 변동 이력이 없어요.
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>

<script src="js/material-history.js"></script>
</body>
</html>
